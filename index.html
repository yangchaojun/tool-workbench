<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D9488'/%3E%3Ccircle cx='11' cy='11' r='3.2' fill='white'/%3E%3Ccircle cx='21' cy='11' r='3.2' fill='white'/%3E%3Ccircle cx='11' cy='21' r='3.2' fill='white'/%3E%3Ccircle cx='21' cy='21' r='3.2' fill='%23EA580C'/%3E%3C/svg%3E"
    />
    <title>工具台</title>
    <script>
      // 首帧前同步主题，避免暗色用户看到亮色闪烁
      try {
        if (JSON.parse(localStorage.getItem('tw:theme') || '{}').dark) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
